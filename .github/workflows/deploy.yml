name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --only=production

      - name: Build Docker images
        run: |
          docker build -t codereview-backend ./backend
          docker build -t codereview-frontend ./frontend/react

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: codereview-backend
          format: table
          exit-code: '0'

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: echo "✅ Deploy pipeline completed for CodeReview"