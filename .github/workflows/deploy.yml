name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --only=production

      - name: Build Backend Docker
        run: docker build -t codereview-backend ./backend

      - name: Build Frontend Docker
        run: docker build -t codereview-frontend ./frontend/react

      - name: Security scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: codereview-backend
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  build-ml-ocr:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'ml-service/') ||
      contains(github.event.head_commit.modified, 'ocr-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ML Service
        run: docker build -t codereview-ml ./ml-service

      - name: Build OCR Service
        run: docker build -t codereview-ocr ./ocr-service

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets are set
        run: |
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "❌ JWT_SECRET manquant !"
            exit 1
          fi
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "❌ DB_PASSWORD manquant !"
            exit 1
          fi
          echo "✅ Tous les secrets sont configurés"

      - name: Create .env file
        run: |
          cat > backend/.env << EOF
          NODE_ENV=production
          PORT=5000
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=code_db
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          RUNPOD_URL=${{ secrets.RUNPOD_URL }}
          EOF

      - name: Deploy notification
        run: |
          echo "✅ CodeReview déployé avec succès !"
          echo "🔒 Secrets injectés de façon sécurisée"
          echo "🐳 Images Docker buildées et scannées"